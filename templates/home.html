    {% extends "base.html" %}   <!-- eredita da base.html la struttura-->

    {% block content %}     <!-- sto sovrascrivendo il block all'interno di base (OVERRIDE)-->

            {% for word in sequence %}

            {% endfor %}
        </ul>
    {% endblock %}
